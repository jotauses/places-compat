name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
